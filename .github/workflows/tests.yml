# Runs this repo's existing suite on every push and pull request.
# The suite was always here; nothing ran it but a person remembering to.
name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      # pytesseract is a wrapper; the OCR engine itself is a system package.
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      - run: pip install -r requirements.txt
      # The suite is pytest-based but pytest is a dev tool, not a runtime dep.
      - run: pip install pytest
      - run: python -m spacy download en_core_web_sm
      - run: python -m pytest -q
